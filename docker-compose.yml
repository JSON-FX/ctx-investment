services:
  ctx-investment:
    container_name: ctx-investment
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ctxinvestment.lan}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    environment:
      # Server-side secrets are read at runtime and never baked into the bundle.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Compound reads money through pg, never PostgREST: PostgREST serialises
      # bigint as a JSON number and loses precision above 2^53.
      COMPOUND_DATABASE_URL: ${COMPOUND_DATABASE_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ctxinvestment.lan}
    labels:
      - "traefik.enable=true"
      # The container sits on two networks in local development — dev-net for
      # Traefik and Supabase's own for the database. Without this, Traefik
      # cannot tell which one to reach the backend on and every route 404s.
      - "traefik.docker.network=dev-net"

      # ─── Dev tier ─────────────────────────────────────────────
      #   http://ctxinvestment.test
      - "traefik.http.routers.ctxinvestment-dev.rule=Host(`ctxinvestment.test`)"
      - "traefik.http.routers.ctxinvestment-dev.entrypoints=web"
      - "traefik.http.routers.ctxinvestment-dev.service=ctxinvestment"

      # ─── Local-prod tier ──────────────────────────────────────
      #   https://ctxinvestment.lan
      - "traefik.http.routers.ctxinvestment-prod.rule=Host(`ctxinvestment.lan`)"
      - "traefik.http.routers.ctxinvestment-prod.entrypoints=websecure"
      - "traefik.http.routers.ctxinvestment-prod.tls=true"
      - "traefik.http.routers.ctxinvestment-prod.service=ctxinvestment"

      # Single backing service — Next.js standalone server on port 3000.
      - "traefik.http.services.ctxinvestment.loadbalancer.server.port=3000"
    networks:
      - dev-net
      # Local development also joins Supabase's own network, so the app can
      # reach Postgres and Kong by container name instead of a host port.
      - supabase
    depends_on: []

networks:
  dev-net:
    external: true
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_network_ctx-investment}
